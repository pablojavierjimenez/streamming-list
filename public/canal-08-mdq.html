  <script>
    var data = document.getElementById("datos-navegador");
    var agent = document.getElementById("datos-agent");
    var isAndroid = document.getElementById("isAndroidTV");
    data.innerText = navigator.appVersion;
    agent.innerText = navigator.userAgent;
    
    function isAndroidTV() {
      const ua = navigator.userAgent.toLowerCase();
      const isAndroid = ua.includes("android");
      const hasTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
      const ratio = window.screen.width / window.screen.height;
      const isWideScreen = ratio > 1.7;
      
      return isAndroid && !hasTouch && isWideScreen;
    }
    
    isAndroid.innerText = isAndroidTV();
    console.log("¿Es Android TV?", isAndroidTV());
  </script>
